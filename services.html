<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Tech Generators | 24/7 Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --dark-navy: #0A1628;
            --golden: #D4AF37;
            --golden-light: #F0D77B;
            --white: #FFFFFF;
            --gray: #C8D0D8;
            --whatsapp-green: #25D366;
            --support-blue: #1E5FBB;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ========== MAIN SUPPORT WINDOW ========== */
        .support-window {
            width: 100%;
            max-width: 800px;
            height: 700px;
            background: #FFFFFF;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ========== VOICE AGENT (HIDDEN IFRAME) ========== */
        .voice-agent-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* ========== VOICE INDICATOR BAR ========== */
        .voice-indicator-bar {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            min-height: 55px;
        }
        .voice-status {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .voice-dot {
            width: 12px;
            height: 12px;
            background: #10B981;
            border-radius: 50%;
            animation: voiceDotPulse 1.5s infinite;
        }
        @keyframes voiceDotPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px #10B981; }
            50% { opacity: 0.4; box-shadow: 0 0 20px #10B981; }
        }
        .voice-label {
            color: #6EE7B7;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .voice-wave-container {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .voice-wave-bar {
            width: 3px;
            background: #10B981;
            border-radius: 3px;
            animation: waveAnimation 0.8s ease-in-out infinite;
        }
        .voice-wave-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
        .voice-wave-bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
        .voice-wave-bar:nth-child(3) { height: 14px; animation-delay: 0.2s; }
        .voice-wave-bar:nth-child(4) { height: 24px; animation-delay: 0.3s; }
        .voice-wave-bar:nth-child(5) { height: 16px; animation-delay: 0.4s; }
        @keyframes waveAnimation {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
        .voice-cta {
            color: white;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
            white-space: nowrap;
        }
        .voice-cta:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10B981;
        }

        /* ========== HEADER ========== */
        .support-header {
            background: var(--support-blue);
            padding: 20px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .agent-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #E8ECF1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            position: relative;
            border: 3px solid white;
        }
        .online-dot {
            width: 16px;
            height: 16px;
            background: #25D366;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 3px solid white;
            animation: onlinePulse 2s infinite;
        }
        @keyframes onlinePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            50% { box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
        }
        .agent-info { color: white; flex: 1; }
        .agent-name {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .verified-badge {
            background: #25D366;
            color: white;
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 700;
        }
        .agent-department {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 2px;
        }

        /* ========== CHAT BODY ========== */
        .chat-body {
            flex: 1;
            background: #F5F7FA;
            padding: 20px 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
            animation: msgSlide 0.3s ease-out;
        }
        @keyframes msgSlide {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .message.agent {
            background: white;
            color: #1a1a1a;
            border-bottom-left-radius: 6px;
            align-self: flex-start;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .message.user {
            background: var(--support-blue);
            color: white;
            border-bottom-right-radius: 6px;
            align-self: flex-end;
        }
        .message-time {
            font-size: 0.65rem;
            opacity: 0.5;
            margin-top: 5px;
            text-align: right;
        }

        /* ========== WHATSAPP TRANSFER CARD ========== */
        .whatsapp-transfer-card {
            background: linear-gradient(135deg, #075E54, #128C7E);
            color: white;
            border-radius: 16px;
            padding: 20px 25px;
            margin: 10px 0;
            text-align: center;
            animation: cardPop 0.5s ease-out;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3);
        }
        @keyframes cardPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .wa-transfer-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: #075E54;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .wa-transfer-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* ========== QUICK REPLIES ========== */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 5px 0;
        }
        .quick-reply-btn {
            background: white;
            border: 1.5px solid #D1D5DB;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #374151;
            font-weight: 500;
        }
        .quick-reply-btn:hover {
            background: var(--support-blue);
            color: white;
            border-color: var(--support-blue);
        }

        /* ========== TYPING ========== */
        .typing-bubble {
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .typing-bubble span {
            width: 8px;
            height: 8px;
            background: #9CA3AF;
            border-radius: 50%;
            animation: typingBubble 1.4s infinite;
        }
        .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
        .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBubble {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* ========== INPUT ========== */
        .chat-input-area {
            background: white;
            padding: 15px 25px;
            border-top: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            border: 2px solid #E5E7EB;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 0.9rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .chat-input:focus {
            border-color: var(--support-blue);
            box-shadow: 0 0 0 4px rgba(30, 95, 187, 0.1);
        }
        .send-btn {
            width: 48px;
            height: 48px;
            background: var(--support-blue);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:hover { background: #1749a0; }

        .chat-body::-webkit-scrollbar { width: 5px; }
        .chat-body::-webkit-scrollbar-track { background: transparent; }
        .chat-body::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }

        @media (max-width: 600px) {
            .support-window { height: 100vh; border-radius: 0; max-width: 100%; }
            .message { max-width: 90%; }
            .support-header { padding: 15px; }
            .chat-body { padding: 15px; }
            .chat-input-area { padding: 10px 15px; }
            .voice-indicator-bar { padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <div class="support-window">
        
        <!-- ========== HIDDEN VOICE AGENT IFRAME ========== -->
        <iframe 
            class="voice-agent-hidden"
            id="voiceAgent"
            src="https://elevenlabs.io/app/talk-to?agent_id=agent_5101kz1prewdemm95hmhhd5wxnah&branch_id=agtbrch_5501kz1prfhsfphafejpcxftcf4c"
            allow="microphone"
            title="Voice Agent">
        </iframe>

        <!-- ========== VOICE INDICATOR BAR ========== -->
        <div class="voice-indicator-bar">
            <div class="voice-status">
                <div class="voice-dot"></div>
                <span class="voice-label">🎤 Voice Support Active</span>
                <div class="voice-wave-container">
                    <div class="voice-wave-bar"></div>
                    <div class="voice-wave-bar"></div>
                    <div class="voice-wave-bar"></div>
                    <div class="voice-wave-bar"></div>
                    <div class="voice-wave-bar"></div>
                </div>
            </div>
            <button class="voice-cta" onclick="activateVoice()" title="Click to talk">
                🎤 Talk Now
            </button>
        </div>

        <!-- ========== HEADER ========== -->
        <div class="support-header">
            <div class="agent-avatar">
                <span>👨‍💼</span>
                <div class="online-dot"></div>
            </div>
            <div class="agent-info">
                <div class="agent-name">
                    Ahmad Raza
                    <span class="verified-badge">✓ Verified Agent</span>
                </div>
                <div class="agent-department">
                    Power Tech Generators • 24/7 Support
                </div>
            </div>
        </div>

        <!-- ========== CHAT BODY ========== -->
        <div class="chat-body" id="chatBody">
            
            <div class="message agent">
                <strong>Assalam-o-Alaikum! 👋</strong><br><br>
                Main <strong>Ahmad Raza</strong> hoon, Power Tech Generators ki support team se.<br><br>
                Aap <strong>type kar ke</strong> ya <strong>voice se baat</strong> kar sakte hain. 🎤<br><br>
                Batao main kya help kar sakta hoon? 😊
                <div class="message-time">Just now</div>
            </div>

            <div class="quick-replies" id="quickReplies">
                <button class="quick-reply-btn" onclick="sendQuickReply('Generator price chahiye')">💰 Price</button>
                <button class="quick-reply-btn" onclick="sendQuickReply('Rental ke baare mein batayein')">📅 Rental</button>
                <button class="quick-reply-btn" onclick="sendQuickReply('Emergency support chahiye')">🚨 Emergency</button>
                <button class="quick-reply-btn" onclick="sendQuickReply('Maintenance service')">🔧 Maintenance</button>
            </div>

        </div>

        <!-- ========== INPUT ========== -->
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Type or use voice..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // ========== SMART REPLY SYSTEM ==========
        const replies = {
            'price': 'Generator ki price <strong>13 KVA se 1250 KVA</strong> tak depend karti hai. 🏷️\n\n🔹 <strong>Perkins 20 KVA</strong> - Entry level\n🔹 <strong>Cummins 50 KVA</strong> - Best seller ⭐\n🔹 <strong>CAT 100 KVA</strong> - Premium\n🔹 <strong>Perkins 500 KVA</strong> - Heavy duty\n\nApna KVA batao, exact price bata donga! 📋',
            'rental': 'Rental <strong>daily, weekly, monthly</strong> available! 📅\n\n✅ Events & weddings\n✅ Construction sites\n✅ Industrial backup\n\n🚚 Free delivery Karachi\n🛠️ 24/7 support\n\nKitne KVA aur kitne din?',
            'emergency': '🚨 <strong>Emergency - Turant Response!</strong>\n\n📞 Call: <strong>0322 3619827</strong>\n⏱️ Response: <strong>60 min</strong> (Karachi)\n🔧 On-site team ready!\n\nLocation batao? Abhi dispatch karta hoon!',
            'maintenance': '🛠️ <strong>AMC Packages:</strong>\n\n🥇 Gold: Monthly + Free parts\n🥈 Silver: Bi-monthly\n🥉 Bronze: Quarterly\n\n✅ 24/7 emergency included\n✅ Genuine parts\n\nKitne KVA ka generator?',
            'lead': 'Perfect! Aapka lead qualify ho gaya. 📲\n\nMain aapko <strong>WhatsApp par senior agent</strong> se connect kar raha hoon for best price & delivery.',
            'default': 'Jee, main help kar sakta hoon! 😊\n\n🔹 Price ke liye KVA batao\n🔹 Rental ke liye duration batao\n🔹 Emergency: 0322 3619827\n🔹 AMC ke liye details batao\n\nAur kuch? 👇'
        };

        function getReply(msg) {
            const m = msg.toLowerCase();
            if ((m.includes('kva')||m.includes('generator')) && (m.includes('chahiye')||m.includes('lena')||m.includes('buy')||m.includes('price')||m.includes('quote'))) return 'lead';
            if (m.includes('contact')||m.includes('whatsapp')||m.includes('number')||m.includes('call')) return 'lead';
            if (m.includes('price')||m.includes('kitne')||m.includes('rate')) return 'price';
            if (m.includes('rent')) return 'rental';
            if (m.includes('emergency')||m.includes('urgent')||m.includes('breakdown')) return 'emergency';
            if (m.includes('maintenance')||m.includes('amc')||m.includes('service')) return 'maintenance';
            return 'default';
        }

        function getTime() {
            return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function showTyping() {
            const chatBody = document.getElementById('chatBody');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-bubble';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            const qr = document.getElementById('quickReplies');
            if (qr) { chatBody.insertBefore(typingDiv, qr); } else { chatBody.appendChild(typingDiv); }
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function hideTyping() {
            const t = document.getElementById('typingIndicator');
            if (t) t.remove();
        }

        function addMessage(text, type) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.innerHTML = text + `<div class="message-time">${getTime()}</div>`;
            const qr = document.getElementById('quickReplies');
            if (qr) { chatBody.insertBefore(msgDiv, qr); } else { chatBody.appendChild(msgDiv); }
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showWhatsAppTransfer() {
            const chatBody = document.getElementById('chatBody');
            const qr = document.getElementById('quickReplies');
            if (qr) qr.style.display = 'none';
            
            const card = document.createElement('div');
            card.className = 'whatsapp-transfer-card';
            card.innerHTML = `
                <div style="font-size:3rem;margin-bottom:10px;">📲</div>
                <h4>✅ Lead Qualified! Transferring to WhatsApp...</h4>
                <p>Senior agent aapko <strong>best price aur delivery</strong> dega.</p>
                <a href="https://wa.me/923223619827?text=Assalam-o-Alaikum!%20I%20need%20a%20generator.%20Please%20share%20details." target="_blank" class="wa-transfer-btn">
                    <i class="fab fa-whatsapp"></i> Continue on WhatsApp
                </a>
                <p style="margin-top:12px;font-size:0.75rem;opacity:0.8;">⚡ Response: 2-5 minutes</p>
            `;
            chatBody.appendChild(card);
            chatBody.scrollTop = chatBody.scrollHeight;
            
            setTimeout(() => {
                window.open('https://wa.me/923223619827?text=Assalam-o-Alaikum!%20I%20need%20a%20generator.%20Please%20share%20details.', '_blank');
            }, 2000);
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            
            const replyType = getReply(message);
            setTimeout(showTyping, 400);
            const delay = 1500 + Math.random() * 2000;
            
            setTimeout(() => {
                hideTyping();
                if (replyType === 'lead') {
                    addMessage(replies.lead, 'agent');
                    setTimeout(showWhatsAppTransfer, 1500);
                } else {
                    addMessage(replies[replyType] || replies.default, 'agent');
                }
            }, delay);
        }

        function sendQuickReply(text) {
            document.getElementById('chatInput').value = text;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        // ========== VOICE ACTIVATION ==========
        function activateVoice() {
            const voiceFrame = document.getElementById('voiceAgent');
            // Focus the iframe to activate microphone
            voiceFrame.style.width = '100%';
            voiceFrame.style.height = '100%';
            voiceFrame.style.opacity = '1';
            voiceFrame.style.pointerEvents = 'all';
            voiceFrame.style.zIndex = '100';
            voiceFrame.style.position = 'absolute';
            voiceFrame.style.top = '0';
            voiceFrame.style.left = '0';
            voiceFrame.style.background = 'white';
            
            // Show notification
            alert('🎤 Voice agent activated! Allow microphone access to talk.\n\nAap bol kar baat kar sakte hain - bilkul real agent ki tarah!');
            
            // After 30 seconds, hide again
            setTimeout(() => {
                voiceFrame.style.width = '1px';
                voiceFrame.style.height = '1px';
                voiceFrame.style.opacity = '0';
                voiceFrame.style.pointerEvents = 'none';
                voiceFrame.style.zIndex = '-1';
                voiceFrame.style.position = 'absolute';
            }, 30000);
        }

        // Keyboard shortcut: Ctrl+M for voice
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'm') {
                e.preventDefault();
                activateVoice();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
        });
    </script>
</body>
</html>
